<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90" shape-rendering="crispEdges">
    <title>odf — default theme logo</title>

    <!-- frame -->
    <rect x="0" y="0" width="90" height="90" fill="#08090a" />

    <!-- light grey field with beveled edges -->
    <rect x="6" y="6" width="78" height="78" fill="#d8dade" />
    <rect x="6" y="6" width="78" height="6" fill="#ffffff" />
    <rect x="6" y="78" width="78" height="6" fill="#a9adb3" />
    <rect x="6" y="12" width="6" height="66" fill="#ffffff" />
    <rect x="78" y="12" width="6" height="66" fill="#a9adb3" />

    <!-- left dark pixel square -->
    <rect x="12" y="18" width="24" height="24" fill="#2c3138" />
    <rect x="12" y="18" width="24" height="6" fill="#4a5058" />
    <rect x="12" y="36" width="24" height="6" fill="#14161a" />
    <rect x="12" y="24" width="6" height="18" fill="#4a5058" />
    <rect x="30" y="24" width="6" height="12" fill="#14161a" />

    <!-- right dark pixel square -->
    <rect x="42" y="18" width="24" height="24" fill="#2c3138" />
    <rect x="42" y="18" width="24" height="6" fill="#4a5058" />
    <rect x="42" y="36" width="24" height="6" fill="#14161a" />
    <rect x="42" y="24" width="6" height="18" fill="#4a5058" />
    <rect x="60" y="24" width="6" height="12" fill="#14161a" />
</svg>
