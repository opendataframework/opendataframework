<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90" shape-rendering="crispEdges">
    <title>odf — onyx pixel logo</title>

    <!-- frame -->
    <rect x="0" y="0" width="90" height="90" fill="#0d0f11" />

    <!-- graphite field with beveled edges -->
    <rect x="6" y="6" width="78" height="78" fill="#30343a" />
    <rect x="6" y="6" width="78" height="6" fill="#454a51" />
    <rect x="6" y="78" width="78" height="6" fill="#1c1f23" />
    <rect x="6" y="12" width="6" height="66" fill="#454a51" />
    <rect x="78" y="12" width="6" height="66" fill="#1c1f23" />

    <!-- left light grey pixel square -->
    <rect x="12" y="18" width="24" height="24" fill="#eef0f3" />
    <rect x="12" y="18" width="24" height="6" fill="#ffffff" />
    <rect x="12" y="36" width="24" height="6" fill="#c0c5cc" />
    <rect x="12" y="24" width="6" height="18" fill="#ffffff" />
    <rect x="30" y="24" width="6" height="12" fill="#c0c5cc" />

    <!-- right light grey pixel square -->
    <rect x="42" y="18" width="24" height="24" fill="#eef0f3" />
    <rect x="42" y="18" width="24" height="6" fill="#ffffff" />
    <rect x="42" y="36" width="24" height="6" fill="#c0c5cc" />
    <rect x="42" y="24" width="6" height="18" fill="#ffffff" />
    <rect x="60" y="24" width="6" height="12" fill="#c0c5cc" />
</svg>
