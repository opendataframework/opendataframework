<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/x-icon" href="/static/images/logo.svg">
<title>project_name</title>
<style>
  /* Reset & base */
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0; font-family: Arial, sans-serif;
    background: #0a0a0a; color: #d0d0d0;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: 250px;
    background: #000000;
    border-right: 1px solid #111;
    padding-top: 4rem;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    overflow-y: auto;
    transition: transform 0.3s ease;
    z-index: 10;
  }
  .sidebar.hidden {
    transform: translateX(-100%);
  }
  .sidebar h2 {
    padding-left: 1rem;
    font-weight: normal;
    margin-bottom: 1rem;
    color: #bbb;
  }
  .sidebar nav a {
    display: block;
    padding: 0.75rem 1rem;
    color: #888;
    cursor: pointer;
    text-decoration: none;
    transition: color 0.2s ease;
  }
  .sidebar nav a.active,
  .sidebar nav a:hover {
    color: #fff;
    background: #111;
  }

  /* Main content */
  .main-content {
    flex: 1;
    margin-left: 250px;
    padding: 1rem 2rem 2rem 2rem;
    overflow-y: auto;
    transition: margin-left 0.3s ease;
  }
  .main-content.full {
    margin-left: 0;
  }

  /* Header */
  .header {
    font-size: 1.8rem;
    font-weight: bold;
    margin-bottom: 1rem;
    transition: margin-top 0.3s ease;
  }
  /* When sidebar hidden, add margin-top to header */
  .sidebar.hidden ~ .main-content .header {
    margin-top: 3.5rem;
  }
  /* Also add margin-top on small screens */
  @media (max-width: 900px) {
    .header {
      margin-top: 3.5rem;
    }
  }

  /* Sections - only one visible */
  .section {
    display: none;
  }
  .section.active {
    display: block;
  }

  /* Grid of cards */
  .grid {
    display: grid;
    gap: 1rem;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  }
  @media (min-width: 1200px) {
    .grid {
      grid-template-columns: repeat(5, 1fr);
    }
  }
  @media (max-width: 600px) {
    .grid {
      grid-template-columns: 1fr;
    }
  }

  /* Card styles */
  .card {
    background: #1a1a1a;
    border-radius: 12px;
    padding: 1.25rem 1.25rem 3rem 1.25rem;
    position: relative;
    box-shadow: 0 5px 15px rgba(0,0,0,0.7);
    cursor: default;
    display: flex;
    flex-direction: column;
  }
  .card:hover {
    box-shadow: 0 12px 30px rgba(0,0,0,0.9);
    transform: translateY(-4px);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  /* Card logo top-right */
  .card-logo {
    width: 40px; height: 40px;
    background-color: #444; /* placeholder color */
    border-radius: 8px;
    position: absolute;
    top: 1rem;
    right: 1rem;
  }

  /* Card content */
  .card h3 {
    margin: 0 0 0.5rem 0;
    font-weight: 600;
    color: #eee;
  }
  .card p {
    flex-grow: 1;
    font-size: 0.9rem;
    color: #aaa;
  }

  /* Card footer containers */
  .card-footer-left, .card-footer-right {
    position: absolute;
    bottom: 1rem;
    display: flex;
    align-items: center;
  }
  .card-footer-left {
    left: 1rem;
  }
  .card-footer-right {
    right: 1rem;
  }

  /* Open button on left bottom */
  .card-footer-left button.open-btn {
    background: #333;
    color: #eee;
    border: none;
    border-radius: 8px;
    padding: 0.35rem 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .card-footer-left button.open-btn:hover {
    background: #555;
  }

  /* Settings icon on right bottom */
  .settings-icon {
    width: 22px;
    height: 22px;
    fill: #888;
    cursor: pointer;
    transition: fill 0.2s ease;
  }
  .settings-icon:hover {
    fill: #fff;
  }

  /* Toggle sidebar button */
  .toggle-sidebar-btn {
    position: fixed;
    top: 1rem;
    left: 1rem;
    z-index: 20;
    background: #111;
    border: none;
    color: #d0d0d0;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1.3rem;
    transition: background 0.2s ease;
  }
  .toggle-sidebar-btn:hover {
    background: #222;
  }

  /* Settings panel for each card */
  .settings-panel {
    position: fixed;
    top: 0;
    right: -100%;
    width: 50%;
    height: 100vh;
    background: #111;
    color: #eee;
    padding: 2rem;
    box-shadow: -5px 0 15px rgba(0,0,0,0.8);
    overflow-y: auto;
    transition: right 0.3s ease;
    z-index: 100;
  }
  .settings-panel.active {
    right: 0;
  }
  .settings-panel .close-btn {
    background: #222;
    border: none;
    color: #eee;
    padding: 0.25rem 0.75rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1rem;
    position: absolute;
    top: 1rem;
    right: 1rem;
  }
  .settings-panel .close-btn:hover {
    background: #333;
  }
  .settings-panel h2 {
    margin-top: 0;
  }
  .settings-panel table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 1rem;
  }
  .settings-panel th, .settings-panel td {
    border: 1px solid #333;
    padding: 0.5rem;
    text-align: left;
  }
  .settings-panel th {
    background: #222;
  }

  /* Scrollbar styling for sidebar and main */
  .sidebar::-webkit-scrollbar,
  .main-content::-webkit-scrollbar,
  .settings-panel::-webkit-scrollbar {
    width: 8px;
  }
  .sidebar::-webkit-scrollbar-thumb,
  .main-content::-webkit-scrollbar-thumb,
  .settings-panel::-webkit-scrollbar-thumb {
    background-color: #333;
    border-radius: 4px;
  }

  /* Responsive adjustments */
  @media (max-width: 900px) {
    .main-content {
      margin-left: 0;
      padding-left: 1rem;
      padding-right: 1rem;
    }
    .sidebar {
      transform: translateX(-100%);
      position: fixed;
      z-index: 20;
    }
    .sidebar.visible {
      transform: translateX(0);
    }
  }
</style>

</head>
<body>

<button class="toggle-sidebar-btn" aria-label="Toggle Sidebar">☰ project_name</button>

<div class="sidebar" id="sidebar">
  <!-- <h2 style="color:#B36AE2; font-weight: bold;">Layers</h2> -->
  <h2 style="color:#B36AE2; font-weight: bold;"></h2>
  <nav></nav>
</div>

<div class="main-content" id="mainContent"></div>

<!-- Settings panel template container -->
<div class="settings-panel" id="settingsPanel" aria-hidden="true">
  <button class="close-btn" aria-label="Close Settings Panel">✕</button>
  <h2>Settings</h2>
  <table>
    <thead>
      <tr><th>Setting</th><th>Value</th></tr>
    </thead>
    <tbody id="settingsTable">
    </tbody>
  </table>
</div>

<script>
  const components = {}
</script>

<script>
  const sidebar = document.getElementById('sidebar');
  const toggleBtn = document.querySelector('.toggle-sidebar-btn');
  const mainContent = document.getElementById('mainContent');
  const sectionHeader = document.getElementById('sectionHeader');
  const sections = document.querySelectorAll('.section');
  const navLinks = sidebar.querySelectorAll('nav a');
  const settingsPanel = document.getElementById('settingsPanel');
  const closeSettingsBtn = settingsPanel.querySelector('.close-btn');

  // Create cards for sections
  function createCard(id, section, settings) {
    const card = document.createElement('div');
    card.classList.add('card');
    card.setAttribute('data-section', section);
    card.setAttribute('data-card-id', id);

    // Logo
    const logo = document.createElement('div');
    logo.className = 'card-logo';
    // card.appendChild(logo);

    // Title
    const title = document.createElement('h3');
    title.textContent = `${id}`;
    card.appendChild(title);

    // Description
    const desc = document.createElement('p');
    // desc.textContent = 'This is a description of the card content.';
    desc.textContent = '';
    card.appendChild(desc);

    // Left footer: Open button
    const footerLeft = document.createElement('div');
    footerLeft.className = 'card-footer-left';

    const openBtn = document.createElement('button');
    openBtn.className = 'open-btn';
    openBtn.textContent = 'Open';
    openBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      window.location.href = settings.url
    });
    footerLeft.appendChild(openBtn);
    card.appendChild(footerLeft);

    // Right footer: Settings icon
    const footerRight = document.createElement('div');
    footerRight.className = 'card-footer-right';

    // Updated settings gear icon SVG (from Material Design Icons)
    const settingsIcon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    settingsIcon.setAttribute('viewBox', '0 0 24 24');
    settingsIcon.classList.add('settings-icon');
    settingsIcon.innerHTML = `
      <path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.6-.94l-.36-2.54a.5.5 0 0 0-.5-.43h-3.84a.5.5 0 0 0-.5.43l-.36 2.54a6.87 6.87 0 0 0-1.6.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.9a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.83 14.5a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.48.39 1 .7 1.6.94l.36 2.54a.5.5 0 0 0 .5.43h3.84a.5.5 0 0 0 .5-.43l.36-2.54a6.9 6.9 0 0 0 1.6-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5a3.5 3.5 0 1 1 3.5-3.5 3.5 3.5 0 0 1-3.5 3.5z"/>
    `;

    settingsIcon.addEventListener('click', (e) => {
      e.stopPropagation();
      openSettingsPanel(section, id, settings);
    });
    footerRight.appendChild(settingsIcon);
    card.appendChild(footerRight);

    return card;
  }

  // Generate cards in grids
  function populateSection(sectionId) {
    const grid = document.getElementById(`grid-${sectionId}`);
    grid.innerHTML = '';

    for (const key in components[sectionId]) {
      grid.appendChild(createCard(key, sectionId, components[sectionId][key]));
    }
  }

  // Initialize all sections cards
  const layers = Object.keys(components);
  layers.forEach(populateSection);
  
  // Sidebar nav click handler
  navLinks.forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      const target = link.getAttribute('data-section');

      // Update active nav link
      navLinks.forEach(l => l.classList.remove('active'));
      link.classList.add('active');

      // Show correct section only
      sections.forEach(section => {
        if (section.id === target) {
          section.classList.add('active');
          // sectionHeader.textContent = link.textContent;
        } else {
          section.classList.remove('active');
        }
      });

      // Hide settings panel if open
      closeSettingsPanel();

      // If sidebar is visible on small screen, hide it after selection
      if(window.innerWidth <= 900) {
        sidebar.classList.add('hidden');
        mainContent.classList.add('full');
      } else {
        mainContent.classList.remove('full');
      }
    });
  });

  // Toggle sidebar visibility
  toggleBtn.addEventListener('click', () => {
    sidebar.classList.toggle('hidden');
    mainContent.classList.toggle('full');
  });

  // Open settings panel
  function openSettingsPanel(section, cardId, settings) {
    settingsPanel.classList.add('active');
    settingsPanel.setAttribute('aria-hidden', 'false');
    settingsPanel.querySelector('h2').textContent = `Settings for ${cardId} in ${section}`;

    const tbody = document.getElementById("settingsTable");
    tbody.innerHTML = "";

    for (const key in settings) {
      const tr = document.createElement("tr");
      
      const keyTd = document.createElement("td");
      keyTd.textContent = key;
      tr.appendChild(keyTd);
      
      const valTd = document.createElement("td");
      valTd.textContent = settings[key];
      tr.appendChild(valTd);

      tbody.appendChild(tr);
    }
  }

  // Close settings panel
  function closeSettingsPanel() {
    settingsPanel.classList.remove('active');
    settingsPanel.setAttribute('aria-hidden', 'true');
  }

  // Close settings panel close button
  closeSettingsBtn.addEventListener('click', closeSettingsPanel);

  // Close settings panel if clicking outside it
  document.addEventListener('click', (e) => {
    if (!settingsPanel.contains(e.target) && !e.target.closest('.settings-icon')) {
      closeSettingsPanel();
    }
  });

  // Responsive: hide sidebar initially on small screens
  function checkScreenWidth() {
    if(window.innerWidth <= 900) {
      sidebar.classList.add('hidden');
      mainContent.classList.add('full');
    } else {
      sidebar.classList.remove('hidden');
      mainContent.classList.remove('full');
    }
  }
  window.addEventListener('resize', checkScreenWidth);
  checkScreenWidth();

</script>

</body>
</html>
