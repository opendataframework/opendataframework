[project]
name = "opendataframework"
version = "0.1.0"
description = "Lightweight, config-driven dependency-injection framework for data applications."
authors = [
    {name = "mykytapavlov",email = "mykytapavlov@users.noreply.github.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = []

[project.urls]
Homepage = "https://opendataframework.github.io/opendataframework/"
Repository = "https://github.com/opendataframework/opendataframework"
Documentation = "https://opendataframework.github.io/opendataframework/"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-timeout (>=2.4.0,<3.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
]
docs = [
    "mkdocs-material (>=9.7.7,<10.0.0)",
    "termynal (>=0.14.0,<0.15.0)",
]

[tool.poetry.group.docs]
optional = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.bandit]
exclude_dirs = ["tests", "examples"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--timeout=30 --cov=opendataframework --cov-report=term-missing --cov-fail-under=80"
filterwarnings = [
    # A Service.run() exception is expected to crash its (daemon) background
    # thread — see test_service_run_exception_is_logged. Attribution of this
    # warning to a specific test is timing-dependent since it fires
    # asynchronously, so it's filtered globally rather than per-test.
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.coverage.run]
source = ["opendataframework"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
