site_name: Open Data Framework
site_description: Lightweight dependency-injection framework for data applications.
repo_url: https://github.com/opendataframework/opendataframework
repo_name: opendataframework/opendataframework

docs_dir: docs

nav:
  - Overview: index.md
  - Examples: examples.md
  - Release Notes: release-notes.md
  - Reference:
      - Entity: entity.md
      - Repository: repository.md
      - View: view.md
      - Component: component.md
      - Service: service.md
      - Task: task.md
      - Pipeline: pipeline.md
      - Agent: agent.md
      - Function: function.md
      - Layer: layer.md
      - Context: context.md
      - Config: config.md
      - Project: project.md
      - Namespace: namespace.md
      - Logger: logger.md
      - Events: events.md
      - Notifications: notifications.md

theme:
  name: material
  custom_dir: overrides
  logo: images/light.svg
  favicon: images/light.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

plugins:
  - search
  - termynal

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/scheme-favicon.js
